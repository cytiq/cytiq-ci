name: docker-publish

# Builds each platform natively on its own GitHub-hosted runner (no QEMU) and
# pushes it by digest; the merge job then tags one manifest list over all of
# them. Each platform image keeps its SBOM and provenance attestations.

on:
  workflow_call:
    inputs:
      image:
        description: "Image name, without registry/org prefix (e.g. cytiq-cli)"
        type: string
        required: true
      version:
        description: "Primary tag to push (e.g. 1.2.3 or 1.2.3-rc1)"
        type: string
        required: true
      latest:
        description: "Also tag and push :latest"
        type: boolean
        default: false
      ref:
        description: "Git ref or commit to build (default: the ref that triggered the caller)"
        type: string
        default: ""
      context:
        description: "Docker build context"
        type: string
        default: "."
      dockerfile:
        description: "Path to the Dockerfile"
        type: string
        default: "Dockerfile"
      build_args:
        description: "Build arguments, one KEY=VALUE per line"
        type: string
        default: ""
      enable_cache:
        description: "Read platform-specific registry cache; export only on trusted releases"
        type: boolean
        default: false
      platforms:
        description: "Target platforms, comma-separated: linux/amd64 and/or linux/arm64"
        type: string
        default: "linux/amd64,linux/arm64"
      registry:
        description: "Container registry"
        type: string
        default: "ghcr.io"
      org:
        description: "Registry namespace/org"
        type: string
        default: "cytiq"
    secrets:
      GH_TOKEN:
        required: false
    outputs:
      image:
        description: "Full image name without a tag (e.g. ghcr.io/cytiq/cytiq-cli)"
        value: ${{ jobs.prepare.outputs.image }}
      digest:
        description: "Digest of the pushed manifest list (sha256:...); pin deployments to image@digest"
        value: ${{ jobs.merge.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:
  # The tags to push, and one native runner per platform.
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      tags: ${{ steps.resolve.outputs.tags }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve image, tags and runners
        id: resolve
        env:
          IMAGE: ${{ inputs.registry }}/${{ inputs.org }}/${{ inputs.image }}
          VERSION: ${{ inputs.version }}
          LATEST: ${{ inputs.latest }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          tags="$IMAGE:$VERSION"
          if [ "$LATEST" = "true" ]; then
            tags="$tags"$'\n'"$IMAGE:latest"
          fi

          matrix='[]'
          IFS=',' read -ra platforms <<< "${PLATFORMS// /}"
          for platform in "${platforms[@]}"; do
            case "$platform" in
              linux/amd64) runner=ubuntu-24.04 ;;
              linux/arm64) runner=ubuntu-24.04-arm ;;
              *) echo "::error::No native runner for platform '$platform'"; exit 1 ;;
            esac
            matrix=$(jq -c --arg platform "$platform" --arg runner "$runner" \
              '. + [{platform: $platform, runner: $runner, slug: ($platform | gsub("/"; "-"))}]' <<< "$matrix")
          done
          if [ "$matrix" = '[]' ]; then
            echo "::error::No platforms given"
            exit 1
          fi

          {
            echo "image=$IMAGE"
            echo "matrix=$matrix"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN || github.token }}

      # Pushed untagged, by digest only: the merge job tags the manifest list.
      # The SBOM and max-mode provenance go with each platform's image, so a
      # pinned digest carries what it was built from.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ inputs.build_args }}
          cache-from: ${{ inputs.enable_cache && format('type=registry,ref={0}:cache-{1}', needs.prepare.outputs.image, matrix.slug) || '' }}
          cache-to: >-
            ${{ inputs.enable_cache &&
            ((github.event_name == 'push' &&
            (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/'))) ||
            (github.event_name == 'workflow_dispatch' &&
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
            (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
            github.event.pull_request.base.ref == github.event.repository.default_branch)) &&
            format('type=registry,ref={0}:cache-{1},mode=max,ignore-error=true', needs.prepare.outputs.image, matrix.slug) || '' }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-${{ inputs.image }}-${{ inputs.version }}-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # One manifest list over the platform images, pushed under every tag.
  merge:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.inspect.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.image }}-${{ inputs.version }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN || github.token }}

      - name: Create and push the manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              args+=(--tag "$tag")
            fi
          done <<< "$TAGS"
          for digest in *; do
            args+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect the manifest list
        id: inspect
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ inputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE@$digest"

      - name: Summary
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          DIGEST: ${{ steps.inspect.outputs.digest }}
          PLATFORMS: ${{ inputs.platforms }}
        run: echo "Pushed \`$IMAGE@$DIGEST\` for \`$PLATFORMS\`" >> "$GITHUB_STEP_SUMMARY"
