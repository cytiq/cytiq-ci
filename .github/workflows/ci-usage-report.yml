name: CI usage report

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-usage-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Collect the last 30 full UTC days
        env:
          GH_TOKEN: ${{ secrets.CI_METRICS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set CI_METRICS_TOKEN with Actions: read on the nine Cytiq repositories"
            exit 1
          fi
          python3 scripts/ci_usage_report.py --output-dir "$RUNNER_TEMP/ci-report"

      - name: Summarize usage
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ci-report/report.md" ]; then
            cat "$RUNNER_TEMP/ci-report/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve complete or partial reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-usage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-report/
          if-no-files-found: ignore
          retention-days: 90
